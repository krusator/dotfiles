unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on       # renumber all windows when any window is closed
set -g mouse on
set-option -g status-position top

set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
# List of plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'christoomey/vim-tmux-navigator'

## Theme catppuccin
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor "mocha"
# Kanagawa Wave palette (kanagawa.nvim) mapped onto catppuccin's color names.
# Catppuccin only sets @thm_* when unset, so these win over the mocha flavor.
set -g @thm_bg "#1f1f28"          # sumiInk3
set -g @thm_fg "#dcd7ba"          # fujiWhite
set -g @thm_rosewater "#d27e99"   # sakuraPink
set -g @thm_flamingo "#e46876"    # waveRed
set -g @thm_pink "#d27e99"        # sakuraPink
set -g @thm_mauve "#957fb8"       # oniViolet
set -g @thm_red "#c34043"         # autumnRed
set -g @thm_maroon "#e46876"      # waveRed
set -g @thm_peach "#ffa066"       # surimiOrange
set -g @thm_yellow "#e6c384"      # carpYellow
set -g @thm_green "#98bb6c"       # springGreen
set -g @thm_teal "#7aa89f"        # waveAqua2
set -g @thm_sky "#7fb4ca"         # springBlue
set -g @thm_sapphire "#658594"    # dragonBlue
set -g @thm_blue "#7e9cd8"        # crystalBlue
set -g @thm_lavender "#9cabca"    # springViolet2
set -g @thm_subtext_1 "#c8c093"   # oldWhite
set -g @thm_subtext_0 "#c8c093"   # oldWhite
set -g @thm_overlay_2 "#938aa9"   # springViolet1
set -g @thm_overlay_1 "#717c7c"   # katanaGray
set -g @thm_overlay_0 "#727169"   # fujiGray
set -g @thm_surface_2 "#54546d"   # sumiInk6
set -g @thm_surface_1 "#363646"   # sumiInk5
set -g @thm_surface_0 "#2a2a37"   # sumiInk4
set -g @thm_mantle "#181820"      # sumiInk1
set -g @thm_crust "#16161d"       # sumiInk0

# Make the active pane stand out: accent color, heavy borders, arrows
set -g @catppuccin_pane_border_style "fg=#54546d"         # sumiInk6
set -g @catppuccin_pane_active_border_style "fg=#957fb8"  # oniViolet
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
tmux_gray="#555555"
set -g @catppuccin_status_background "$tmux_gray"
run '~/.tmux/plugins/tmux/catppuccin.tmux'
set -g status-right-length 70
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -g @plugin 'tmux-plugins/tmux-battery'
# https://github.com/tmux-plugins/tmux-battery/tree/master
run '~/.tmux/plugins/tmux-battery/battery.tmux'
set -agF status-right "#{E:@catppuccin_status_pomodoro_plus}"
# https://github.com/olimorris/tmux-pomodoro-plus/tree/main
set -g @plugin 'olimorris/tmux-pomodoro-plus'
set -g status-left ""

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'S-Left' if-shell "$is_vim" 'send-keys S-Left'  'select-pane -L'
bind-key -n 'S-Down' if-shell "$is_vim" 'send-keys S-Down'  'select-pane -D'
bind-key -n 'S-Up' if-shell "$is_vim" 'send-keys S-Up'  'select-pane -U'
bind-key -n 'S-Right' if-shell "$is_vim" 'send-keys S-Right'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
# if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
#     "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
# if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
#     "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'S-Left' select-pane -L
bind-key -T copy-mode-vi 'S-Down' select-pane -D
bind-key -T copy-mode-vi 'S-Up' select-pane -U
bind-key -T copy-mode-vi 'S-Right' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
# bind-key -n 'S-Left' if-shell "$is_vim" 'send-keys S-Left'  'select-pane -L'
# bind-key -n 'S-Down' if-shell "$is_vim" 'send-keys S-Down'  'select-pane -D'
# bind-key -n 'S-Up' if-shell "$is_vim" 'send-keys S-Up'  'select-pane -U'
# bind-key -n 'S-Right' if-shell "$is_vim" 'send-keys S-Right'  'select-pane -R'
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# use my own tmx finder
bind-key -r f run-shell "tmux neww tmx"

# Claude Code instances: popup (a) or side pane (A), see ~/tools/claude-picker
bind-key a display-popup -E -w 80% -h 70% -T " Claude " "~/tools/claude-picker"
bind-key A split-window -h -l 40% "~/tools/claude-picker --pane"
# clear buffer and screen -> crtl-l
bind-key -n C-l send-keys C-l \; send-keys -R \; clear-history
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
